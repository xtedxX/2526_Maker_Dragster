<svg width="100%" viewBox="0 0 680 580" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Dragster Electrical Schematic</title>
<desc>Electrical schematic showing power distribution and signal connections</desc>

<style>
  .t { font-family: sans-serif; font-size: 14px; fill: #3d3d3a; }
  .ts { font-family: sans-serif; font-size: 12px; fill: #73726c; }
  .th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #3d3d3a; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #444441; }
  .c-gray .ts { fill: #5F5E5A; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #26215C; }
  .c-purple .ts { fill: #534AB7; }
  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #04342C; }
  .c-teal .ts { fill: #0F6E56; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue .th { fill: #042C53; }
  .c-blue .ts { fill: #185FA5; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th { fill: #4A1B0C; }
  .c-coral .ts { fill: #993C1D; }
  .c-green rect { fill: #EAF3DE; stroke: #3B6D11; }
  .c-green .th { fill: #173404; }
  .c-green .ts { fill: #3B6D11; }
  .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber .th { fill: #412402; }
  .c-amber .ts { fill: #854F0B; }
  .c-pink rect { fill: #FBEAF0; stroke: #993556; }
  .c-pink .th { fill: #4B1528; }
  .c-pink .ts { fill: #993556; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="th" x="340" y="30" text-anchor="middle">Electrical Schematic Overview</text>

<!-- Power Section -->
<g class="c-green">
  <rect x="40" y="60" width="260" height="120" rx="12" stroke-width="0.5"/>
  <text class="th" x="170" y="85" text-anchor="middle">Power Distribution</text>
</g>

<g class="c-green">
  <rect x="60" y="100" width="100" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="110" y="120" text-anchor="middle" dominant-baseline="central">LiPo 3S</text>
  <text class="ts" x="110" y="138" text-anchor="middle" dominant-baseline="central">11.1V / 2200mAh</text>
</g>

<g class="c-amber">
  <rect x="180" y="100" width="100" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="230" y="120" text-anchor="middle" dominant-baseline="central">Buck Conv.</text>
  <text class="ts" x="230" y="138" text-anchor="middle" dominant-baseline="central">Würth 173950378</text>
</g>

<line x1="160" y1="128" x2="180" y2="128" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="170" y="120" text-anchor="middle">11.1V</text>

<g class="c-amber">
  <rect x="320" y="100" width="80" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="360" y="122" text-anchor="middle" dominant-baseline="central">5V Rail</text>
</g>

<line x1="280" y1="128" x2="320" y2="122" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="300" y="120" text-anchor="middle">5V/3A</text>

<g class="c-amber">
  <rect x="420" y="100" width="100" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="470" y="120" text-anchor="middle" dominant-baseline="central">LDO</text>
  <text class="ts" x="470" y="138" text-anchor="middle" dominant-baseline="central">5V → 3.3V</text>
</g>

<line x1="400" y1="122" x2="420" y2="128" class="arr" marker-end="url(#arrow)"/>

<g class="c-amber">
  <rect x="540" y="100" width="100" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="590" y="122" text-anchor="middle" dominant-baseline="central">3.3V Logic</text>
</g>

<line x1="520" y1="128" x2="540" y2="122" class="arr" marker-end="url(#arrow)"/>

<!-- MCU Section -->
<g class="c-purple">
  <rect x="40" y="200" width="260" height="160" rx="12" stroke-width="0.5"/>
  <text class="th" x="170" y="225" text-anchor="middle">Microcontroller Unit</text>
</g>

<g class="c-purple">
  <rect x="60" y="245" width="220" height="64" rx="8" stroke-width="0.5"/>
  <text class="th" x="170" y="265" text-anchor="middle" dominant-baseline="central">STM32G431CBU6</text>
  <text class="ts" x="170" y="283" text-anchor="middle" dominant-baseline="central">ARM Cortex-M4 @ 170 MHz</text>
  <text class="ts" x="170" y="298" text-anchor="middle" dominant-baseline="central">UFQFPN-48 Package</text>
</g>

<line x1="590" y1="144" x2="590" y2="200" x2="280" y2="200" x2="280" y2="245" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="450" y="195">3.3V</text>

<g class="c-gray">
  <rect x="80" y="320" width="80" height="32" rx="6" stroke-width="0.5"/>
  <text class="ts" x="120" y="338" text-anchor="middle" dominant-baseline="central">HSE 8 MHz</text>
</g>

<g class="c-gray">
  <rect x="180" y="320" width="80" height="32" rx="6" stroke-width="0.5"/>
  <text class="ts" x="220" y="338" text-anchor="middle" dominant-baseline="central">JTAG/SWD</text>
</g>

<!-- Sensors -->
<g class="c-teal">
  <rect x="330" y="200" width="310" height="160" rx="12" stroke-width="0.5"/>
  <text class="th" x="485" y="225" text-anchor="middle">Sensors & Peripherals</text>
</g>

<g class="c-teal">
  <rect x="350" y="245" width="130" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="415" y="265" text-anchor="middle" dominant-baseline="central">MMA8452Q</text>
  <text class="ts" x="415" y="283" text-anchor="middle" dominant-baseline="central">I²C @ 0x1D</text>
</g>

<line x1="280" y1="265" x2="350" y2="265" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="315" y="260">I²C1</text>

<g class="c-teal">
  <rect x="500" y="245" width="130" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="565" y="265" text-anchor="middle" dominant-baseline="central">TC1602A LCD</text>
  <text class="ts" x="565" y="283" text-anchor="middle" dominant-baseline="central">4-bit parallel</text>
</g>

<path d="M 280 285 L 320 285 Q 330 285 330 295 L 330 315 Q 330 325 340 325 L 500 325 Q 510 325 510 315 L 510 301" 
      fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="400" y="340">GPIO</text>

<g class="c-pink">
  <rect x="350" y="315" width="130" height="32" rx="6" stroke-width="0.5"/>
  <text class="ts" x="415" y="333" text-anchor="middle" dominant-baseline="central">WS2812B ⚠️ 3.3V</text>
</g>

<path d="M 230 309 L 230 331 L 350 331" 
      fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="280" y="345" font-size="10">TIM2 PWM</text>

<!-- Communications -->
<g class="c-blue">
  <rect x="40" y="380" width="310" height="160" rx="12" stroke-width="0.5"/>
  <text class="th" x="195" y="405" text-anchor="middle">Communications</text>
</g>

<g class="c-blue">
  <rect x="60" y="425" width="130" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="125" y="445" text-anchor="middle" dominant-baseline="central">HC-05</text>
  <text class="ts" x="125" y="463" text-anchor="middle" dominant-baseline="central">BT 2.0 @ 9600</text>
</g>

<line x1="125" y1="309" x2="125" y2="425" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="95" y="370">USART2</text>

<g class="c-gray">
  <rect x="210" y="425" width="120" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="270" y="445" text-anchor="middle" dominant-baseline="central">Debug UART</text>
  <text class="ts" x="270" y="463" text-anchor="middle" dominant-baseline="central">USART1</text>
</g>

<line x1="200" y1="309" x2="200" y2="370" x2="270" y2="370" x2="270" y2="425" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
  <rect x="60" y="495" width="270" height="32" rx="6" stroke-width="0.5"/>
  <text class="ts" x="195" y="513" text-anchor="middle" dominant-baseline="central">Phone / PC Terminal</text>
</g>

<line x1="125" y1="481" x2="125" y2="495" class="arr" marker-end="url(#arrow)"/>

<!-- Motor Control -->
<g class="c-coral">
  <rect x="370" y="380" width="270" height="160" rx="12" stroke-width="0.5"/>
  <text class="th" x="505" y="405" text-anchor="middle">Motor Drive System</text>
</g>

<g class="c-coral">
  <rect x="390" y="425" width="110" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="445" y="445" text-anchor="middle" dominant-baseline="central">Razer ESC</text>
  <text class="ts" x="445" y="463" text-anchor="middle" dominant-baseline="central">60A</text>
</g>

<path d="M 260 275 L 340 275 Q 350 275 350 285 L 350 453 L 390 453" 
      fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="300" y="270">TIM3 PWM</text>

<g class="c-coral">
  <rect x="520" y="425" width="100" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="570" y="445" text-anchor="middle" dominant-baseline="central">BLDC Motor</text>
  <text class="ts" x="570" y="463" text-anchor="middle" dominant-baseline="central">3000 kV</text>
</g>

<line x1="500" y1="453" x2="520" y2="453" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="510" y="448" text-anchor="middle" font-size="10">3-phase</text>

<path d="M 110 156 L 110 190 Q 110 200 120 200 L 580 200 Q 590 200 590 210 L 590 380 L 445 380 L 445 425" 
      fill="none" stroke="#639922" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="550" y="375">11.1V Direct</text>

<rect x="40" y="555" width="600" height="2" fill="#73726c"/>
<text class="ts" x="340" y="570" text-anchor="middle">Common Ground (GND)</text>

</svg>