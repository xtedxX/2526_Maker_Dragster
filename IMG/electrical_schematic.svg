<svg width="100%" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Dragster Electrical Schematic</title>
<desc>Electrical schematic showing power distribution and signal connections</desc>

<style>
  .t { font-family: sans-serif; font-size: 14px; fill: #3d3d3a; }
  .ts { font-family: sans-serif; font-size: 12px; fill: #73726c; }
  .th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #3d3d3a; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #444441; }
  .c-gray .ts { fill: #5F5E5A; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #26215C; }
  .c-purple .ts { fill: #534AB7; }
  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #04342C; }
  .c-teal .ts { fill: #0F6E56; }
  .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue .th { fill: #042C53; }
  .c-blue .ts { fill: #185FA5; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th { fill: #4A1B0C; }
  .c-coral .ts { fill: #993C1D; }
  .c-green rect { fill: #EAF3DE; stroke: #3B6D11; }
  .c-green .th { fill: #173404; }
  .c-green .ts { fill: #3B6D11; }
  .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber .th { fill: #412402; }
  .c-amber .ts { fill: #854F0B; }
  @media (prefers-color-scheme: dark) {
    .t { fill: #c2c0b6; }
    .ts { fill: #9c9a92; }
    .th { fill: #e8e6dc; }
    .c-gray rect { fill: #444441; stroke: #D3D1C7; }
    .c-gray .th { fill: #F1EFE8; }
    .c-gray .ts { fill: #D3D1C7; }
    .c-purple rect { fill: #3C3489; stroke: #CECBF6; }
    .c-purple .th { fill: #EEEDFE; }
    .c-purple .ts { fill: #CECBF6; }
    .c-teal rect { fill: #085041; stroke: #9FE1CB; }
    .c-teal .th { fill: #E1F5EE; }
    .c-teal .ts { fill: #9FE1CB; }
    .c-blue rect { fill: #0C447C; stroke: #B5D4F4; }
    .c-blue .th { fill: #E6F1FB; }
    .c-blue .ts { fill: #B5D4F4; }
    .c-coral rect { fill: #712B13; stroke: #F5C4B3; }
    .c-coral .th { fill: #FAECE7; }
    .c-coral .ts { fill: #F5C4B3; }
    .c-green rect { fill: #27500A; stroke: #C0DD97; }
    .c-green .th { fill: #EAF3DE; }
    .c-green .ts { fill: #C0DD97; }
    .c-amber rect { fill: #633806; stroke: #FAC775; }
    .c-amber .th { fill: #FAEEDA; }
    .c-amber .ts { fill: #FAC775; }
  }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="th" x="340" y="30" text-anchor="middle">Electrical Schematic Overview</text>

<!-- Battery (Top Left) -->
<g class="c-green">
  <rect x="60" y="60" width="100" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="110" y="80" text-anchor="middle" dominant-baseline="central">LiPo 3S</text>
  <text class="ts" x="110" y="98" text-anchor="middle" dominant-baseline="central">11.1V 2200mAh</text>
</g>

<!-- Power Rails (Top) -->
<g class="c-amber">
  <rect x="200" y="60" width="100" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="250" y="80" text-anchor="middle" dominant-baseline="central">Buck Conv.</text>
  <text class="ts" x="250" y="98" text-anchor="middle" dominant-baseline="central">Würth 173950378</text>
</g>

<line x1="160" y1="88" x2="200" y2="88" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="180" y="80" text-anchor="middle">11.1V</text>

<g class="c-amber">
  <rect x="340" y="60" width="80" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="380" y="82" text-anchor="middle" dominant-baseline="central">5V Rail</text>
</g>

<line x1="300" y1="88" x2="340" y2="82" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="320" y="80" text-anchor="middle">5V 3A</text>

<g class="c-amber">
  <rect x="460" y="60" width="80" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="500" y="80" text-anchor="middle" dominant-baseline="central">LDO</text>
  <text class="ts" x="500" y="98" text-anchor="middle" dominant-baseline="central">5V→3.3V</text>
</g>

<line x1="420" y1="82" x2="460" y2="88" class="arr" marker-end="url(#arrow)"/>

<g class="c-amber">
  <rect x="580" y="60" width="80" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="620" y="82" text-anchor="middle" dominant-baseline="central">3.3V Logic</text>
</g>

<line x1="540" y1="88" x2="580" y2="82" class="arr" marker-end="url(#arrow)"/>

<!-- STM32 (Center) -->
<g class="c-purple">
  <rect x="240" y="180" width="200" height="70" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="205" text-anchor="middle" dominant-baseline="central">STM32G431CBU6</text>
  <text class="ts" x="340" y="223" text-anchor="middle" dominant-baseline="central">ARM Cortex-M4 @ 170 MHz</text>
  <text class="ts" x="340" y="238" text-anchor="middle" dominant-baseline="central">Main Controller</text>
</g>

<!-- Power to STM32 -->
<path d="M 620 104 L 620 140 L 340 140 L 340 180" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="480" y="135" font-size="10">3.3V Power</text>

<!-- Accelerometer (Top Left Sensor) -->
<g class="c-teal">
  <rect x="60" y="300" width="120" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="120" y="320" text-anchor="middle" dominant-baseline="central">MMA8452Q</text>
  <text class="ts" x="120" y="338" text-anchor="middle" dominant-baseline="central">Accelerometer</text>
</g>

<line x1="240" y1="230" x2="180" y2="328" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="210" y="280" text-anchor="middle" font-size="11">I²C1</text>

<!-- LCD (Top Right Sensor) -->
<g class="c-teal">
  <rect x="500" y="300" width="120" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="560" y="320" text-anchor="middle" dominant-baseline="central">TC1602A</text>
  <text class="ts" x="560" y="338" text-anchor="middle" dominant-baseline="central">LCD 16×2</text>
</g>

<line x1="440" y1="230" x2="500" y2="328" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="470" y="280" text-anchor="middle" font-size="11">GPIO 4-bit</text>

<!-- NeoPixel (Right Sensor) -->
<g class="c-teal">
  <rect x="500" y="380" width="120" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="560" y="402" text-anchor="middle" dominant-baseline="central">WS2812B LED ⚠️</text>
</g>

<line x1="440" y1="215" x2="500" y2="402" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="470" y="310" text-anchor="middle" font-size="11">TIM2 PWM</text>

<!-- Bluetooth (Bottom Left) -->
<g class="c-blue">
  <rect x="60" y="380" width="120" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="120" y="400" text-anchor="middle" dominant-baseline="central">HC-05</text>
  <text class="ts" x="120" y="418" text-anchor="middle" dominant-baseline="central">Bluetooth 2.0</text>
</g>

<line x1="240" y1="240" x2="180" y2="408" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="210" y="325" text-anchor="middle" font-size="11">USART2</text>

<!-- External Phone/PC -->
<g class="c-blue">
  <rect x="60" y="460" width="120" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="120" y="482" text-anchor="middle" dominant-baseline="central">Phone / PC</text>
</g>

<line x1="120" y1="436" x2="120" y2="460" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="140" y="450" font-size="10">BT Wireless</text>

<!-- ESC (Bottom Center) -->
<g class="c-coral">
  <rect x="240" y="380" width="110" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="295" y="400" text-anchor="middle" dominant-baseline="central">Razer ESC</text>
  <text class="ts" x="295" y="418" text-anchor="middle" dominant-baseline="central">60A PWM</text>
</g>

<line x1="320" y1="250" x2="295" y2="380" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="315" text-anchor="end" font-size="11">TIM3 PWM</text>

<!-- BLDC Motor (Bottom Right) -->
<g class="c-coral">
  <rect x="380" y="380" width="110" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="435" y="400" text-anchor="middle" dominant-baseline="central">BLDC Motor</text>
  <text class="ts" x="435" y="418" text-anchor="middle" dominant-baseline="central">3000 kV</text>
</g>

<line x1="350" y1="408" x2="380" y2="408" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="365" y="403" text-anchor="middle" font-size="10">3-phase</text>

<!-- Battery Direct to ESC -->
<path d="M 110 116 L 110 150 Q 110 160 120 160 L 220 160 Q 230 160 230 170 L 230 380" 
      fill="none" stroke="#639922" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="180" y="155" font-size="11">11.1V Direct Power</text>

<!-- Battery to Motor (via ESC) -->
<path d="M 295 436 L 295 450 Q 295 460 305 460 L 425 460 Q 435 460 435 450 L 435 436" 
      fill="none" stroke="#639922" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="360" y="472" font-size="10">11.1V Motor Power</text>

<!-- Debug/Programming -->
<g class="c-gray">
  <rect x="280" y="300" width="120" height="40" rx="6" stroke-width="0.5"/>
  <text class="ts" x="340" y="315" text-anchor="middle" dominant-baseline="central">Debug Interface</text>
  <text class="ts" x="340" y="330" text-anchor="middle" dominant-baseline="central">JTAG/SWD + USART1</text>
</g>

<line x1="340" y1="250" x2="340" y2="300" stroke="#73726c" stroke-width="1" stroke-dasharray="2 2"/>

<!-- Ground -->
<rect x="60" y="540" width="560" height="3" fill="#73726c"/>
<text class="ts" x="340" y="560" text-anchor="middle">Common Ground (GND)</text>

<!-- Notes -->
<text class="ts" x="340" y="580" text-anchor="middle" font-size="10">All digital signals at 3.3V logic level</text>

</svg>