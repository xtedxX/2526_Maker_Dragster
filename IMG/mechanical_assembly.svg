<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Dragster Mechanical Assembly</title>
<desc>Mechanical assembly showing chassis, components, and drivetrain</desc>

<style>
  .t { font-family: sans-serif; font-size: 14px; fill: #3d3d3a; }
  .ts { font-family: sans-serif; font-size: 12px; fill: #73726c; }
  .th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #3d3d3a; }
  .leader { stroke: #73726c; stroke-width: 0.5; stroke-dasharray: 2 2; fill: none; }
  .c-gray rect, .c-gray circle { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #444441; }
  .c-gray .ts { fill: #5F5E5A; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #26215C; }
  .c-purple .ts { fill: #534AB7; }
  .c-green rect { fill: #EAF3DE; stroke: #3B6D11; }
  .c-green .th { fill: #173404; }
  .c-green .ts { fill: #3B6D11; }
  .c-coral rect, .c-coral circle, .c-coral ellipse { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th { fill: #4A1B0C; }
  .c-coral .ts { fill: #993C1D; }
  .c-amber circle { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber .th { fill: #412402; }
  .c-amber .ts { fill: #854F0B; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="th" x="340" y="30" text-anchor="middle">Mechanical Assembly Overview</text>

<!-- Main Chassis -->
<g class="c-gray">
  <rect x="100" y="220" width="480" height="80" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="245" text-anchor="middle">Main Chassis (PLA)</text>
  <text class="ts" x="340" y="263" text-anchor="middle">250 mm × 120 mm × 15 mm</text>
  <text class="ts" x="340" y="278" text-anchor="middle">Weight: 85 g</text>
</g>

<!-- Mounting points -->
<circle cx="130" cy="235" r="4" class="c-gray" stroke-width="0.5"/>
<circle cx="550" cy="235" r="4" class="c-gray" stroke-width="0.5"/>
<circle cx="130" cy="285" r="4" class="c-gray" stroke-width="0.5"/>
<circle cx="550" cy="285" r="4" class="c-gray" stroke-width="0.5"/>
<text class="ts" x="140" y="232" font-size="10">M3</text>

<!-- PCB -->
<g class="c-purple">
  <rect x="250" y="180" width="180" height="60" rx="6" stroke-width="0.5"/>
  <text class="th" x="340" y="200" text-anchor="middle" dominant-baseline="central">PCB Assembly</text>
  <text class="ts" x="340" y="218" text-anchor="middle" dominant-baseline="central">60×60 mm, 4-layer</text>
  <text class="ts" x="340" y="233" text-anchor="middle" dominant-baseline="central">Weight: 45 g</text>
</g>

<!-- Standoffs -->
<line x1="290" y1="240" x2="290" y2="260" stroke="#73726c" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<line x1="390" y1="240" x2="390" y2="260" stroke="#73726c" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

<!-- Battery -->
<g class="c-green">
  <rect x="180" y="310" width="140" height="50" rx="6" stroke-width="0.5"/>
  <text class="th" x="250" y="328" text-anchor="middle" dominant-baseline="central">LiPo Battery</text>
  <text class="ts" x="250" y="346" text-anchor="middle" dominant-baseline="central">3S 2200mAh (180g)</text>
</g>

<rect x="180" y="333" width="140" height="8" rx="2" fill="none" stroke="#73726c" stroke-width="1" stroke-dasharray="4 2"/>

<!-- Front Wheels -->
<g class="c-gray">
  <circle cx="150" cy="420" r="20" stroke-width="0.5"/>
  <text class="ts" x="150" y="425" text-anchor="middle" dominant-baseline="central">Front</text>
  <text class="ts" x="150" y="455" text-anchor="middle">Ø 30 mm</text>
</g>

<!-- Guide -->
<g class="c-gray">
  <rect x="125" y="380" width="50" height="20" rx="4" stroke-width="0.5"/>
  <text class="ts" x="150" y="392" text-anchor="middle" font-size="10">Guide</text>
</g>

<!-- Front Axle -->
<line x1="90" y1="420" x2="210" y2="420" stroke="#73726c" stroke-width="2"/>

<!-- Motor Mount -->
<g class="c-coral">
  <rect x="450" y="310" width="110" height="50" rx="6" stroke-width="0.5"/>
  <text class="th" x="505" y="328" text-anchor="middle" dominant-baseline="central">Motor Mount</text>
  <text class="ts" x="505" y="346" text-anchor="middle" dominant-baseline="central">Angled Bracket</text>
</g>

<line x1="480" y1="360" x2="480" y2="380" stroke="#73726c" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<line x1="530" y1="360" x2="530" y2="380" stroke="#73726c" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

<!-- Motor -->
<g class="c-coral">
  <ellipse cx="505" cy="430" rx="35" ry="28" stroke-width="0.5"/>
  <text class="th" x="505" y="428" text-anchor="middle" dominant-baseline="central">BLDC</text>
  <text class="ts" x="505" y="443" text-anchor="middle" dominant-baseline="central">3652</text>
</g>

<!-- Pinion -->
<line x1="470" y1="430" x2="450" y2="430" stroke="#73726c" stroke-width="3"/>
<circle cx="450" cy="430" r="6" class="c-amber" stroke-width="0.5"/>
<text class="ts" x="450" y="420" text-anchor="middle" font-size="9">10T</text>

<!-- Belt -->
<path d="M 444 424 Q 380 400 340 424" fill="none" stroke="#73726c" stroke-width="2"/>
<path d="M 444 436 Q 380 460 340 436" fill="none" stroke="#73726c" stroke-width="2"/>
<text class="ts" x="390" y="415" text-anchor="middle" font-size="10">GT2 Belt</text>

<!-- Rear Wheels -->
<g class="c-gray">
  <circle cx="340" cy="430" r="30" stroke-width="0.5"/>
  <text class="ts" x="340" y="435" text-anchor="middle" dominant-baseline="central">Rear</text>
  <text class="ts" x="340" y="475" text-anchor="middle">Ø 50 mm</text>
</g>

<circle cx="340" cy="430" r="10" class="c-amber" stroke-width="0.5"/>
<text class="ts" x="340" y="495" text-anchor="middle" font-size="9">16T</text>

<!-- Rear Axle -->
<line x1="280" y1="430" x2="400" y2="430" stroke="#73726c" stroke-width="3"/>

<!-- Axle Support -->
<g class="c-gray">
  <rect x="360" y="310" width="100" height="40" rx="6" stroke-width="0.5"/>
  <text class="ts" x="410" y="325" text-anchor="middle" dominant-baseline="central">Axle Support</text>
  <text class="ts" x="410" y="340" text-anchor="middle" font-size="10">608ZZ Bearings</text>
</g>

<line x1="390" y1="350" x2="360" y2="405" class="leader"/>
<line x1="430" y1="350" x2="320" y2="405" class="leader"/>

<!-- Annotations -->
<line class="leader" x1="340" y1="180" x2="340" y2="80"/>
<circle cx="340" cy="180" r="2" fill="#73726c"/>
<text class="ts" x="345" y="85">Center of Gravity</text>

<line class="leader" x1="390" y1="430" x2="540" y2="480"/>
<circle cx="390" cy="430" r="2" fill="#73726c"/>
<text class="ts" x="545" y="485">Ratio: 1.6:1</text>

<!-- Dimensions -->
<line x1="100" y1="200" x2="100" y2="300" stroke="#73726c" stroke-width="0.5"/>
<line x1="95" y1="200" x2="105" y2="200" stroke="#73726c" stroke-width="0.5"/>
<line x1="95" y1="300" x2="105" y2="300" stroke="#73726c" stroke-width="0.5"/>
<text class="ts" x="75" y="252" text-anchor="end" font-size="10">80 mm</text>

<line x1="100" y1="495" x2="580" y2="495" stroke="#73726c" stroke-width="0.5"/>
<line x1="100" y1="490" x2="100" y2="500" stroke="#73726c" stroke-width="0.5"/>
<line x1="580" y1="490" x2="580" y2="500" stroke="#73726c" stroke-width="0.5"/>
<text class="ts" x="340" y="512" text-anchor="middle" font-size="10">~250 mm Wheelbase</text>

<!-- Weight -->
<text class="ts" x="150" y="100">Front: 30% (~140 g)</text>
<text class="ts" x="480" y="100">Rear: 70% (~330 g)</text>
<text class="th" x="340" y="60" text-anchor="middle">Total Mass: 473 g</text>

</svg>